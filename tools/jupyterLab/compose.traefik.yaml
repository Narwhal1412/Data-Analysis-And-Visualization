# Override for adding traefik labels

services:
 jupyter:
  labels:
   - "traefik.enable=true"
   - "traefik.http.routers.jupyter.rule=Host(`jupyter.hatamoto.uk`)"
   - "traefik.http.routers.jupyter.entrypoints=websecure"
   - "traefik.http.routers.jupyter.tls.certresolver=myresolver"
   - "traefik.http.services.jupyter.loadbalancer.server.port=8888"
   # Use authentik for authentication and authorization
   - "traefik.http.routers.jupyter.middlewares=authentik@docker"
  networks:
   - komodo_default

networks:
 komodo_default:
  external: true
